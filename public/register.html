<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - AI Story Forge</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 粒子背景 -->
    <div id="particles-js"></div>

    <!-- 主容器 -->
    <div class="container auth-container">
        <!-- 头部 -->
        <header class="app-header">
            <h1>✨ AI Story Forge</h1>
            <p class="subtitle">创意故事工坊 - 与AI共同创作</p>
        </header>

        <!-- 注册表单 -->
        <main class="auth-form">
            <h2>📝 用户注册</h2>

            <div class="input-group">
                <label>用户名：</label>
                <input type="text" id="register-username" placeholder="3-20个字符" autocomplete="username">
                <small class="input-hint">用户名长度需在3-20个字符之间</small>
            </div>

            <div class="input-group">
                <label>密码：</label>
                <input type="password" id="register-password" placeholder="至少6位" autocomplete="new-password">
                <small class="input-hint">密码长度至少6位</small>
            </div>

            <div class="input-group">
                <label>确认密码：</label>
                <input type="password" id="register-confirm" placeholder="再次输入密码" autocomplete="new-password">
            </div>

            <div class="auth-actions">
                <button onclick="register()" class="generate-btn">注册</button>
                <p class="auth-switch">已有账号？<a href="login.html">立即登录</a></p>
            </div>
        </main>

        <!-- 通知 -->
        <div id="notification" class="notification"></div>

        <!-- 加载状态 -->
        <div id="loading" class="loading-overlay">
            <div class="loader">
                <div class="book">
                    <div class="page"></div>
                    <div class="page"></div>
                    <div class="page"></div>
                </div>
                <p>处理中...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
